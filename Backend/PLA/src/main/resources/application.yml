spring:
  application:
    name: PLA
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB đã có bảng nhưng chưa có flyway_schema_history -> đánh dấu là V1, bỏ qua V1__init_schema
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jpa:
    hibernate:
      # Schema do Flyway quản lý, Hibernate không được tự sửa
      ddl-auto: none
  task:
    execution:
      # Giữ executor mặc định (applicationTaskExecutor) dù đã khai báo aiExecutor trong AiConfig;
      # nếu không, Spring Boot bỏ executor mặc định và mọi @Async không tên dồn vào aiExecutor
      mode: force
  config:
    import: optional:file:.env[.properties],optional:file:PLA/.env[.properties]   # đọc file .env khi chạy local
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.6-flash}

ldq:
  jwt:
    token-validity-in-seconds: ${JWT_VALIDITY_SECONDS:86400}