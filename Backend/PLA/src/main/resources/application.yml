spring:
  application:
    name: PLA
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # DB đã có bảng nhưng chưa có flyway_schema_history -> đánh dấu là V1, bỏ qua V1__init_schema
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jpa:
    hibernate:
      # Schema do Flyway quản lý, Hibernate không được tự sửa
      ddl-auto: none

ldq:
  jwt:
    token-validity-in-seconds: ${JWT_VALIDITY_SECONDS:86400}